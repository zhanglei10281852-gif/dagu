rubrics:
  - id: 1
    type: f2p
    text: "有管理权限的用户可通过队列 API 和 Queues 页面暂停或恢复具体队列；状态、原因、操作人和时间可读取、可审计、幂等，并在独立 server/scheduler 进程及重启后保持一致。"
  - id: 2
    type: f2p
    text: "队列暂停期间，新的和原有待处理项都保留且不产生新启动，已经取得本地或分布式运行所有权的任务继续执行而不被取消。"
  - id: 3
    type: f2p
    text: "暂停与已选中条目的最终本地启动或分布式 admission 并发时，暂停成功之后不会跨过交接边界，条目仍保持可恢复的排队状态。"
  - id: 4
    type: f2p
    text: "暂停状态读取失败时该队列按关闭认领处理且不消费条目；暂停或恢复写入失败时保留原状态并返回可诊断错误，存储恢复后可再次操作。"
  - id: 5
    type: f2p
    text: "恢复会唤醒 parked 扫描，并在容量约束下按既有高低优先级和同级稳定顺序继续处理保留的积压。"
  - id: 6
    type: p2p
    text: "未暂停队列、默认未暂停路径、DAG 本地队列和配置的全局队列继续按原有并发、计数、浏览和手动 dequeue 语义工作。"
  - id: 7
    type: p2p
    text: "现有全局 scheduler pause 仍只影响 scheduler-driven 创建并保留其既定的 dequeue/catch-up 行为，队列级控制不会把两种状态或权限混为一谈。"
